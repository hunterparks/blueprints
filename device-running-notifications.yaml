blueprint:
  name: Device Running Notifications
  description: Sends notifications when a device starts and stops running, based on a running binary sensor.
  domain: automation
  input:
    running_sensor:
      name: Device Running Sensor
      description: Binary sensor that reports whether the device is running.
      selector:
        entity:
          domain: binary_sensor
          device_class: running
    notification_boolean:
      name: Notification Helper
      description: Boolean that controls whether notifications are sent.
      selector:
        entity:
          domain: input_boolean
    on_action:
      name: When Turned On
      description: Notification to send when the device starts running, e.g. notify.pushover with a message.
      selector:
        action: {}
    off_action:
      name: When Turned Off
      description: Notification to send when the device finishes running, e.g. notify.pushover with a message.
      selector:
        action: {}
mode: queued
trigger:
  - platform: state
    entity_id: !input running_sensor
    to: "on"
    id: device_on

  - platform: state
    entity_id: !input running_sensor
    from: "on"
    id: device_off
condition:
  - condition: state
    entity_id: !input notification_boolean
    state: "on"
action:
  - choose:
      - conditions:
          - condition: trigger
            id: device_on
        sequence: !input on_action

      - conditions:
          - condition: trigger
            id: device_off
        sequence: !input off_action
